<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The California Walk</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'San Francisco', 'Helvetica Neue', Arial, sans-serif;
            background: #f8f6f3;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .container {
            background: white;
            padding: 3rem;
            border-radius: 12px;
            text-align: center;
            max-width: 450px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
        }
        h1 { color: #8B4513; margin-bottom: 1rem; font-size: 1.6rem; }
        p { color: #555; line-height: 1.6; margin-bottom: 1.5rem; }
        a {
            display: inline-block;
            color: #8B4513;
            text-decoration: none;
            font-weight: 600;
        }
        a:hover { text-decoration: underline; }
    </style>
</head>
<body>
    <div class="container">
        <h1>Thanks for reaching out.</h1>
        <p>I'll get back to you.</p>
        <a href="/">Back to the walk</a>
    </div>
</body>
</html>
